services:
  api:
    build: .
    container_name: livora_api
    restart: always
    ports:
      - "80:3000"
    env_file: .env.production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: livora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-livora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-livora_secret}
      POSTGRES_DB: ${DB_NAME:-livora_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: livora_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
