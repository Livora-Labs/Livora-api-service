services:

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: livora_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-livora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-livora_secret}
      POSTGRES_DB: ${DB_NAME:-livora_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: livora_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

