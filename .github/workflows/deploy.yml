name: CI/CD Pipeline & Zero-Downtime Deployment

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 🧪 Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Run Unit & Integration Test Suite
        run: npm run test -- --forceExit --maxWorkers=2

  security-scan:
    name: 🛡️ Security Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo & FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  build-and-push:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: livora-api-service:${{ github.sha }},livora-api-service:latest

  deploy:
    name: 🚀 Zero-Downtime Deployment (VPS)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue Zero-Downtime en VPS..."
            cd /opt/livora/Livora-api-service
            
            echo "📥 Obteniendo cambios del repositorio..."
            git pull origin main
            
            echo "📦 Ejecutando migraciones de base de datos..."
            npx prisma migrate deploy
            
            echo "🔄 Construyendo y levantando nuevos contenedores con Rolling Reload..."
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --no-deps api worker
            
            echo "🩺 Esperando confirmación de Healthcheck de la nueva instancia..."
            until [ $(docker inspect --format='{{json .State.Health.Status}}' livora_api_service_api_1 2>/dev/null || echo '"healthy"') = '"healthy"' ]; do
              echo "Esperando a que la API esté completamente saludable..."
              sleep 3
            done
            
            echo "🌐 Recargando Caddy 2 sin pérdida de conexiones..."
            docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile || true
            
            echo "🧹 Limpiando imágenes huérfanas..."
            docker image prune -f
            
            echo "✅ Despliegue Zero-Downtime completado exitosamente!"
