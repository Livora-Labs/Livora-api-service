[package]
name = "ecotoken_registry"
version = "0.1.0"
edition = "2021"
authors = ["Livora Team"]
description = "Stellar Soroban Smart Contract for EcoToken and BatchRegistry traceability"
license = "MIT OR Apache-2.0"
autobins = false

[dependencies]
soroban-sdk = "21.0.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
ed25519-dalek = { version = "2.1.0", features = ["rand_core"] }
stellar-strkey = "0.0.8"

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
opt-level = "z"
panic = "abort"
overflow-checks = true
